# Liquibase configuration for the Oracle test repository.
# The Liquibase Sudarshan plugin performs STATIC validation without this connection;
# it is needed for `liquibase update` and for the plugin's read-only database dry run.

changelog-file=changelog/changelog-master.xml
url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
username=app_user
password=CHANGE_ME
driver=oracle.jdbc.OracleDriver

# Select a country dataset with a context filter, e.g.:
#   liquibase update --context-filter="GLOBAL,SG"
context-filter=GLOBAL

logLevel=info
